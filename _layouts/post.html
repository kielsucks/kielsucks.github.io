---
layout: default
---
<article class="post">
  <p class="post-meta">
    <span>{{ page.date | date: '%Y.%m.%d' }}</span>
    {% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}
  </p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
</article>
